send_text:
  name: Send text
  description: Render text on a SoundBridge's VFD display.
  fields:
    device_id:
      name: Device
      description: The SoundBridge unit(s) to send to.
      required: true
      selector:
        device:
          integration: soundbridge
          multiple: true
    message:
      name: Message
      description: The text to display.
      required: true
      example: "Front door opened"
      selector:
        text:
    x:
      name: X position
      description: X coordinate, or "c" to center. Ignored if scroll is enabled.
      default: "c"
      selector:
        text:
    y:
      name: Y position
      description: Y coordinate, or "c" to center. Ignored if scroll is enabled.
      default: "c"
      selector:
        text:
    font:
      name: Font
      description: Font index (see `sketch> font list` on the device shell).
      default: 3
      selector:
        number:
          min: 0
          max: 20
          mode: box
    clear:
      name: Clear first
      description: Clear the display before drawing.
      default: true
      selector:
        boolean:
    scroll:
      name: Scroll
      description: Use a scrolling marquee instead of static text. Useful for messages wider than the display.
      default: false
      selector:
        boolean:
    scroll_repeat:
      name: Repeat scrolling
      description: >-
        Keep the marquee scrolling indefinitely. The device's marquee makes a
        single pass and then stops, so the integration re-issues it to loop.
        Only applies when Scroll is enabled.
      default: true
      selector:
        boolean:
    scroll_interval:
      name: Scroll repeat interval (seconds)
      description: >-
        How long one pass takes, i.e. how often to restart the marquee. Leave
        unset to estimate it from the message length and font. Set it manually
        if looping stutters: too low restarts the text mid-pass (it jumps back),
        too high leaves a gap between passes.
      selector:
        number:
          min: 1
          max: 120
          step: 0.5
          mode: box
          unit_of_measurement: seconds

    duration:
      name: Duration (seconds)
      description: >-
        Automatically hand the display back to the device's own UI (clock/now-playing)
        after this many seconds. If left unset, the message stays up - and the
        device's own UI stays frozen - until you call soundbridge.clear,
        soundbridge.release, or send another message.
      selector:
        number:
          min: 1
          max: 3600
          mode: box
          unit_of_measurement: seconds

clear:
  name: Clear display
  description: Clear a SoundBridge's display and stop any running marquee. Leaves the connection held open - call release to hand control back to the device's own UI.
  fields:
    device_id:
      name: Device
      description: The SoundBridge unit(s) to clear.
      required: true
      selector:
        device:
          integration: soundbridge
          multiple: true

release:
  name: Release display
  description: Hand control of the display back to the device's own UI (clock/now-playing) and disconnect.
  fields:
    device_id:
      name: Device
      description: The SoundBridge unit(s) to release.
      required: true
      selector:
        device:
          integration: soundbridge
          multiple: true
